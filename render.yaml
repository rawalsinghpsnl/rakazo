# Rakazo on Render — FREE tier ($0) single-service deployment.
#
# Why one service: Render's free plan only allows web services (no private
# services, no background workers). So migrations + API + worker + web UI all
# run inside a single free web service from the prebuilt public image.
# The web UI proxies /api to the API on localhost:3100 inside the container.
#
# Limits of this setup:
# - Free web services sleep after ~15 min of inactivity (first request wakes).
# - Free Postgres expires after 30 days (see expiresAt in dashboard).
# - If one process (api/worker) crashes, the container keeps running.

services:
  - type: web
    name: rakazo-web
    runtime: image
    plan: free
    region: singapore
    image:
      url: ghcr.io/elie222/rakazo/app:edge
    healthCheckPath: /
    dockerCommand: >-
      bash -lc 'pnpm --filter @rakazo/db exec prisma migrate deploy
      && pnpm --filter @rakazo/api start & pnpm --filter @rakazo/worker start &
      pnpm --filter @rakazo/web preview --host 0.0.0.0 --port "$PORT"'
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rakazo-db
          property: connectionString
      - key: REDIS_URL
        value: ""
      - key: API_PROXY_TARGET
        value: http://127.0.0.1:3100
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SCREEN_PROXY_SECRET
        generateValue: true
      # Set these after the first deploy, once the public URL is known:
      # - key: WEB_ORIGIN
      #   value: https://<rakazo-web-public-url>
      # - key: BETTER_AUTH_URL
      #   value: https://<rakazo-web-public-url>/api
      # - key: API_URL
      #   value: https://<rakazo-web-public-url>/api

databases:
  - name: rakazo-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: rakazo
    databaseUser: rakazo
